                            description: PhaseRetryStatus is the retry count and history
                              of a single stage.
                            properties:
                              attempts:
                                description: |-
                                  Attempts is the number of failures of this stage so far (excluding the
                                  attempt in progress).
                                type: integer
                              history:
                                description: History is the detail of each failure
                                  (chronological).
                                items:
                                  description: RestoreAttempt is the detail of one
                                    failure.
                                  properties:
                                    message:
                                      description: Message is the failure detail.
                                      type: string
                                    reason:
                                      description: Reason is the failure classification
                                        (e.g. "RestoreFromStorage rejected").
                                      type: string
                                    time:
                                      description: Time is the failure time.
                                      format: date-time
                                      type: string
                                  type: object
                                type: array
                              maxRetry:
                                description: MaxRetry is the snapshot of retryCount
                                  at that time.
                                type: integer
                              phase:
                                description: Phase identifies the stage.
                                type: string
                            required:
                            - attempts
                            - maxRetry
                            - phase
                            type: object
                          type: array
                        pod:
                          description: Pod is the pod info.
                          properties:
                            ip:
                              type: string
                            name:
                              type: string
                            namespace:
                              type: string
                            nodeName:
                              type: string
                            uid:
                              description: |-
                                UID is a type that holds unique ID values, including UUIDs.  Because we
                                don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                                intent and helps make sure that UIDs and names do not get conflated.
                              type: string
                          type: object
                        startupMode:
                          description: |-
                            StartupMode records whether this replica came up "from checkpoint
                            restore" or "cold-start fallback"; only meaningful after the replica
                            reaches a terminal state.
                          type: string
                      type: object
                    type: array
                  failedCount:
                    description: FailedCount is the number of failed restore pods.
                    type: integer
                  message:
                    description: Message is the status description.
                    type: string
                  phase:
                    description: |-
                      Phase is the current phase: Pending (replica pods to be created) ->
                      Restoring (replicas created, pulling data / waiting for containers to
                      settle) -> Succeeded / PartiallySucceeded / Failed.
                    type: string
                  succeededCount:
                    description: SucceededCount is the number of successfully restored
                      pods.
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
