{{- if .Values.service.enable }}

apiVersion: v1
kind: Service
metadata:
  name: lj-runtimekit-exporter-svc
  namespace: {{ include "lj-runtimekit-exporter.namespace" . }}
  labels:
    {{- include "lj-runtimekit-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: "lj-runtimekit-exporter"
    app: "lj-runtimekit-exporter"
  {{- with .Values.service.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: "metrics"
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: TCP
  selector:
    {{- include "lj-runtimekit-exporter.selectorLabels" . | nindent 4 }}
{{- end }}
