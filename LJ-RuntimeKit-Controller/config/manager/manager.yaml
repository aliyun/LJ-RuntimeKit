apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: lj-runtimekit-controller
    app.kubernetes.io/managed-by: kustomize
  name: lj-runtimekit-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lj-runtimekit-controller-manager
  namespace: lj-runtimekit-system
  labels:
    app.kubernetes.io/name: lj-runtimekit-controller
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lj-runtimekit-controller
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      securityContext:
        {}
      containers:
        - name: manager
          image: lj-runtimekit-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --job-namespace=lj-runtimekit-system
            - --job-image=lj-runtimekit-controller-job-agent:latest
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      serviceAccountName: lj-runtimekit-controller
      terminationGracePeriodSeconds: 10
