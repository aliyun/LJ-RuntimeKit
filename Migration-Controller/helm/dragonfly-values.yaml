          > 100
        for: 1m
        labels:
          severity: warning
      - alert: SeedClientSuccessRateOfDownloadingTask
        annotations:
          message: Seed client's success rate of downloading task is low
          summary: Seed client's success rate of downloading task is low
        expr: (sum(rate(dragonfly_client_download_task_total{container="seed-client"}[1m]))
          - sum(rate(dragonfly_client_download_task_failure_total{container="seed-client"}[1m])))
          / sum(rate(dragonfly_client_download_task_total{container="seed-client"}[1m]))
          < 0.6
        for: 5m
        labels:
          severity: critical
