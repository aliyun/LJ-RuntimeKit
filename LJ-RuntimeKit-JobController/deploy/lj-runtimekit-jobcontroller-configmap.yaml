apiVersion: v1
kind: ConfigMap
metadata:
  name: lj-runtimekit-jobcontroller-config
  namespace: kube-system
data:
  config.yaml: |
    # 唯一必填项；其余字段都有内置默认值，只在需要偏离默认时才写。
    image: lj-runtimekit-registry.cn-hangzhou.cr.aliyuncs.com/lj-runtimekit/lj-runtimekit-profiling-collector:v1.14.0-k8s1.34
    imagePullPolicy: IfNotPresent
    activeMonitoringImage: lj-runtimekit-registry.cn-hangzhou.cr.aliyuncs.com/lj-runtimekit/lj-runtimekit-diag:v1.14.0-k8s1.34
    # 同时决定 collector 的 --socket 与宿主机 socket 目录挂载，必须与 Runtime Kit 实际路径一致。
    socketPath: /run/amp/eKitC/xdm/sockets/dp2mgr.sock
    # 目标 Pod 中被视为 GPU 容器的资源名，可按键改成集群实际使用的资源名；
    # 未写或留空的键取下面这组默认值（与 LJ-RuntimeKit-Exporter 协议 ConfigMap 对齐）。
    gpuResources:
      resources.memory: aliyun.com/gpu-memory
      resources.core: aliyun.com/gpu-core
      resources.slice: aliyun.com/gpu-slice
      resources.gpu: aliyun.com/gpu
      resources.nvidia: nvidia.com/gpu
      resources.migPrefix: nvidia.com/mig-
    #
    # 可选字段（取默认值时不必写）：
    #   imagePullSecrets、resources、tolerations、priorityClassName、
    #   finishTimeout、stopTimeout、pendingTimeout、maxRetries、retryBackoff、maxRetryBackoff
    # pollInterval、rpcTimeout、startTimeout、streamIdleTimeout 已不再生效，
    # 仅为兼容旧 ConfigMap 保留解析，不要新增。
