apiVersion: v1
kind: ServiceAccount
metadata:
  name: lj-runtimekit-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: lj-runtimekit-exporter
    app.kubernetes.io/component: "lj-runtimekit-exporter"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lj-runtimekit-exporter-read-pods
  labels:
    app.kubernetes.io/name: lj-runtimekit-exporter
    app.kubernetes.io/component: "lj-runtimekit-exporter"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lj-runtimekit-exporter
  labels:
    app.kubernetes.io/name: lj-runtimekit-exporter
    app.kubernetes.io/component: "lj-runtimekit-exporter"
subjects:
- kind: ServiceAccount
  name: lj-runtimekit-exporter
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: lj-runtimekit-exporter-read-pods
  apiGroup: rbac.authorization.k8s.io
