client:
  config:
    download:
      concurrentPieceCount: 16
      pieceTimeout: 30s
      rateLimit: 50GiB
      server:
        requestRateLimit: 4000
        socketPath: /var/run/dragonfly/dfdaemon.sock
    dynconfig:
      refreshInterval: 5m
    gc:
      interval: 900s
      policy:
        distHighThresholdPercent: 80
        distLowThresholdPercent: 60
        taskTTL: 168h
    health:
      server:
        port: 4003
    host:
      idc: ""
      location: ""
    log:
      level: info
    manager:
      addr: http://dragonfly-manager.dragonfly.svc.cluster.local:8080
    metrics:
      server:
        port: 4002
    proxy:
      disableBackToSource: false
      prefetch: false
      prefetchRateLimit: 5GiB
      readBufferSize: 4194304
      registryMirror:
        addr: https://index.docker.io
      rules:
      - regex: blobs/sha256.*
      server:
        port: 4001
    scheduler:
      addr: dragonfly-scheduler.dragonfly.svc.cluster.local:8002
      announceInterval: 5m
      enableBackToSource: true
      maxScheduleCount: 5
      scheduleTimeout: 30s
    server:
      cacheDir: /var/cache/dragonfly/dfdaemon/
      pluginDir: /var/lib/dragonfly/plugins/dfdaemon/
    stats:
      server:
        port: 4004
    storage:
      dir: /var/lib/dragonfly/
      keep: true
      readBufferSize: 4194304
      writeBufferSize: 4194304
    upload:
      disableShared: false
      rateLimit: 50GiB
      server:
        port: 4000
        requestRateLimit: 4000
    verbose: false
  dfinit:
    config:
      containerRuntime:
        containerd:
          configPath: /etc/containerd/config.toml
          registries:
          - capabilities:
            - pull
            - resolve
            hostNamespace: docker.io
            serverAddr: https://index.docker.io
            skipVerify: true
          - capabilities:
            - pull
            - resolve
            hostNamespace: ghcr.io
            serverAddr: https://ghcr.io
            skipVerify: true
      log:
        level: info
      proxy:
        addr: http://127.0.0.1:4001
      verbose: false
    enable: false
    image:
      digest: ""
      pullPolicy: IfNotPresent
      registry: docker.io
      repository: dragonflyoss/dfinit
      tag: v0.2.17
  enable: true
  extraVolumeMounts:
  - mountPath: /home/admin/t4/migration
    name: migration
  extraVolumes:
  - hostPath:
      path: /home/admin/t4/migration
      type: DirectoryOrCreate
    name: migration
  fullnameOverride: ""
  hostAliases: []
  hostIPC: true
  hostNetwork: true
  hostPID: true
  image:
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
    registry: docker.io
    repository: dragonflyoss/client
    tag: v2.4.3
  initContainer:
    image:
      digest: ""
      pullPolicy: IfNotPresent
      registry: docker.io
      repository: library/busybox
      tag: latest
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "0"
        memory: "0"
  maxProcs: ""
  metrics:
    enable: true
    prometheusRule:
      additionalLabels: {}
      enable: false
      rules:
      - alert: ClientDown
        annotations:
          message: Client instance {{ "{{ $labels.instance }}" }} is down
          summary: Client instance is down
        expr: sum(dragonfly_client_version{container="client"}) == 0
        for: 5m
        labels:
          severity: critical
      - alert: ClientHighNumberOfFailedDownloadTask
        annotations:
          message: Client has a high number of failed download task
          summary: Client has a high number of failed download task
        expr: sum(irate(dragonfly_client_download_task_failure_total{container="client"}[1m]))
          > 100
        for: 1m
        labels:
          severity: warning
      - alert: ClientSuccessRateOfDownloadingTask
        annotations:
          message: Client's success rate of downloading task is low
          summary: Client's success rate of downloading task is low
        expr: (sum(rate(dragonfly_client_download_task_total{container="client"}[1m]))
          - sum(rate(dragonfly_client_download_task_failure_total{container="client"}[1m])))
          / sum(rate(dragonfly_client_download_task_total{container="client"}[1m]))
          < 0.6
        for: 5m
        labels:
          severity: critical
    service:
      annotations: {}
      labels: {}
      type: ClusterIP
    serviceMonitor:
      additionalLabels: {}
      enable: false
      interval: 30s
      scrapeTimeout: 10s
  name: client
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 128Mi
  statefulsetAnnotations: {}
  tolerations: []
  updateStrategy: {}
