manager:
  config:
    auth:
      jwt:
        key: ZHJhZ29uZmx5Cg==
        maxRefresh: 48h
        realm: Dragonfly
        timeout: 48h
    cache:
      local:
        size: 30000
        ttl: 3m
      redis:
        addrs:
        - dragonfly-redis-ext.dragonfly.svc.cluster.local:6379
        ttl: 5m
    console: true
    database:
      mysql:
        dbname: dragonfly
        host: dragonfly-mysql-ext.dragonfly.svc.cluster.local
        password: dragonfly123
        port: 3306
        user: dragonfly
      type: mysql
    jaeger: ""
    job:
      gc:
        interval: 3h
        ttl: 6h
      preheat:
        registryTimeout: 1m
        tls:
          insecureSkipVerify: false
      rateLimit:
        capacity: 10
        fillInterval: 1m
        quantum: 10
      syncPeers:
        interval: 24h
        timeout: 10m
    network:
      enableIPv6: false
    pprofPort: -1
    server:
      cacheDir: ""
      grpc:
        advertiseIP: ""
      logDir: ""
      pluginDir: ""
      rest:
        tls:
          cert: ""
          key: ""
      workHome: ""
    verbose: false
  deploymentAnnotations: {}
  enable: true
  extraVolumeMounts:
  - mountPath: /var/log/dragonfly/manager
    name: logs
  extraVolumes:
  - emptyDir: {}
    name: logs
  fullnameOverride: ""
  grpcPort: 65003
  hostAliases: []
  hostNetwork: false
  image:
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
    registry: docker.io
    repository: dragonflyoss/manager
    tag: v2.4.3
  ingress:
    annotations: {}
    className: ""
    enable: false
    hosts: []
    path: /
    pathType: ImplementationSpecific
    tls: []
  initContainer:
    image:
      digest: ""
      pullPolicy: IfNotPresent
      registry: docker.io
      repository: library/busybox
      tag: latest
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "0"
        memory: "0"
  maxProcs: ""
  metrics:
    enable: true
    prometheusRule:
      additionalLabels: {}
      enable: false
      rules:
      - alert: ManagerDown
        annotations:
          message: Manager instance {{ "{{ $labels.instance }}" }} is down
          summary: Manager instance is down
        expr: sum(dragonfly_manager_version{}) == 0
        for: 5m
        labels:
          severity: critical
      - alert: ManagerHighNumberOfFailedGRPCRequest
        annotations:
          message: Manager has a high number of failed grpc request
          summary: Manager has a high number of failed grpc request
        expr: sum(rate(grpc_server_started_total{grpc_service="manager.Manager",grpc_type="unary"}[1m]))
          - sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="OK"}[1m]))
          + sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="NotFound"}[1m]))
          + sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="PermissionDenied"}[1m]))
          + sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="InvalidArgument"}[1m]))
          > 100
        for: 1m
        labels:
          severity: warning
      - alert: ManagerSuccessRateOfGRPCRequest
        annotations:
          message: Manager's success rate of grpc request is low
          summary: Manager's success rate of grpc request is low
        expr: (sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="OK"}[1m]))
          + sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="NotFound"}[1m]))
          + sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="PermissionDenied"}[1m]))
          + sum(rate(grpc_server_handled_total{grpc_service="manager.Manager",grpc_type="unary",grpc_code="InvalidArgument"}[1m])))
          / sum(rate(grpc_server_started_total{grpc_service="manager.Manager",grpc_type="unary"}[1m]))
          < 0.6
        for: 5m
        labels:
          severity: critical
      - alert: ManagerHighNumberOfFailedRESTRequest
        annotations:
          message: Manager has a high number of failed rest request
          summary: Manager has a high number of failed rest request
        expr: sum(rate(dragonfly_manager_requests_total{}[1m])) - sum(rate(dragonfly_manager_requests_total{code=~"[12].."}[1m]))
          > 100
        for: 1m
        labels:
          severity: warning
      - alert: ManagerSuccessRateOfRESTRequest
        annotations:
          message: Manager's success rate of rest request is low
          summary: Manager's success rate of rest request is low
        expr: sum(rate(dragonfly_manager_requests_total{code=~"[12].."}[1m])) / sum(rate(dragonfly_manager_requests_total{}[1m]))
          < 0.6
        for: 5m
        labels:
          severity: critical
    service:
      annotations: {}
      labels: {}
      type: ClusterIP
    serviceMonitor:
      additionalLabels: {}
      enable: false
      interval: 30s
      scrapeTimeout: 10s
  name: manager
  nameOverride: ""
  nodeSelector: {}
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  replicas: 1
  resources:
    limits:
