---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: computedomaincliques.resource.nvidia.com
spec:
  group: resource.nvidia.com
  names:
    kind: ComputeDomainClique
    listKind: ComputeDomainCliqueList
    plural: computedomaincliques
    singular: computedomainclique
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: ComputeDomainClique tracks daemons in a ComputeDomain clique.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          daemons:
            type: array
            x-kubernetes-list-type: map
            x-kubernetes-list-map-keys:
            - nodeName
            items:
              description: Information about a daemon in the ComputeDomainClique.
              type: object
              properties:
                nodeName:
                  type: string
                ipAddress:
                  type: string
                cliqueID:
                  type: string
                index:
                  type: integer
                status:
                  type: string
                  enum:
                  - Ready
                  - NotReady
                  default: NotReady
              required:
              - nodeName
