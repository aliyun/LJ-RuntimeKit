
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podAnnotations: {}
# Using this annotation which is required for prometheus scraping
 # prometheus.io/scrape: "true"
 # prometheus.io/port: "9400"

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  capabilities:
     add: ["SYS_ADMIN"]
  # readOnlyRootFilesystem: true

service:
  enable: true
  type: ClusterIP
  port: 9501
  address: ":9501"
  # Annotations to add to the service
  annotations: {}

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
serviceMonitor:
  enabled: false
  interval: 15s
  honorLabels: false
  additionalLabels: {}
    #monitoring: prometheus

tolerations:
- effect: "NoSchedule"
  key: "node-role.kubernetes.io/master"
  operator: "Exists"

nodeSelector:
  lj_runtimekit_enable: "true"

affinity: {}
  #nodeAffinity:
  #  requiredDuringSchedulingIgnoredDuringExecution:
  #    nodeSelectorTerms:
  #    - matchExpressions:
  #      - key: nvidia-gpu
  #        operator: Exists

amperfVolumes:
  - name: rt-grpc
    hostPath: "/run/amp/eKitC/xdm/sockets/"
  - name: pod-resources
    hostPath: "/var/lib/kubelet/pod-resources"

amperfVolumeMounts:
  - name: rt-grpc
    mountPath: "/run/amp/eKitC/xdm/sockets/"
  - name: pod-resources
    mountPath: "/var/lib/kubelet/pod-resources"

hostNetwork: true

# Install the host adapter and attempt configuration generation once per pod start.
# Generation failure does not block the exporter; missing files are retried on invocation.
# The host NPD service must load the generated configuration separately.
npdAdapter:
  enabled: true

amperfEnv:
  - name: "AMPERF_EXPORTER_LISTEN"
    value: ":9501"
  - name: "AMPERF_GRPC_PATH"
    value: "/run/amp/eKitC/xdm/sockets/dp2mgr.sock"
  - name: "AMPERF_EXPORTER_INTERVAL"
    value: "10000"
  - name: "AMPERF_OUTPUT_FORMAT"
    value: "kubergpu"
  - name: "AMPERF_DATA_ACQ_MODE"
    value: "data-push"
  - name: "AMPERF_POD_COLLECTOR_TYPE"
    value: "kubelet-http"
  - name: "AMPERF_COLLECTORS_FILE"
    value: "amperf-exporter-counters.csv"
